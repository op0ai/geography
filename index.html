<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>geography — where the light falls</title>
    <meta name="description" content="Pin any point on Earth at any moment and see exactly what the sun is doing. Then move that place to Mars, or Uranus, and watch the light change." />
    <meta name="theme-color" content="#07080d" />
    <link rel="canonical" href="https://opensolar.app/" />

    <!-- Favicons. Modern minimal set: ico for legacy, SVG (dark-mode aware)
         for everything current, 180px apple-touch, manifest for install. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1020" />

    <!-- Open Graph. The Worker rewrites every [data-dynamic] tag per view, so
         a shared link carries that location's own title, description and card.
         Crawlers don't run JS, which is why this happens at the edge. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="geography" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://opensolar.app/" data-dynamic />
    <meta property="og:title" content="geography — where the light falls" data-dynamic />
    <meta property="og:description" content="Pin any point on Earth at any moment and see exactly what the sun is doing. Then move that place to Mars, or Uranus." data-dynamic />
    <meta property="og:image" content="https://opensolar.app/og.png" data-dynamic />
    <meta property="og:image:secure_url" content="https://opensolar.app/og.png" data-dynamic />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Solar readings for a location: sun altitude, bearing, and hours of daylight." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="geography — where the light falls" data-dynamic />
    <meta name="twitter:description" content="Pin any point on Earth at any moment and see exactly what the sun is doing." data-dynamic />
    <meta name="twitter:image" content="https://opensolar.app/og.png" data-dynamic />
    <meta name="twitter:image:alt" content="Solar readings for a location." />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "geography",
      "url": "https://opensolar.app/",
      "description": "An interactive globe reporting sun position, daylight hours and twilight times for any point on Earth, with a mode that remaps a location onto other planets.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any modern web browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "isAccessibleForFree": true
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
